name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  technical-checks:
    name: technical-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Instalar dependencias desde el lockfile
        run: npm ci
      # --if-present: mientras no haya aplicaciones, los scripts de la raíz no existen y el paso no hace nada.
      - name: Tipos
        run: npm run typecheck --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Formato
        run: npm run format:check --if-present
      - name: Pruebas
        run: npm run test --if-present
      - name: Pruebas de las reglas de Git
        run: npm run test:git
      - name: Build
        run: npm run build --if-present
      - name: Probar la detección de módulos de desarrollo
        run: npm run test:build
      - name: Comprobar que el build web excluye desarrollo
        run: npm run check:web-build
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run test:e2e
